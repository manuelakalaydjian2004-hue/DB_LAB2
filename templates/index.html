<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; }
        .todo-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #ddd; }
        .done-text { text-decoration: line-through; color: gray; }
        .not-done-text { color: black; }
        form { display: inline; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .add-form { margin-bottom: 20px; display: flex; gap: 10px; }
        .add-form input { flex-grow: 1; padding: 8px; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Hi, {{ name }}!</h2>
        <a href="/logout">Logout</a>
    </div>

    <h3>What needs to be done?</h3>
    
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <!-- ADD FORM -->
    <form class="add-form" action="/add" method="POST">
        <input type="text" name="title" placeholder="Add a new task...">
        <button type="submit">Add</button>
    </form>

    <!-- LIST OF TODOS -->
    {% if todos %}
        {% for todo in todos %}
            <div class="todo-item">
                <!-- MARK DONE FORM -->
                <form action="/done/{{ todo.todo_id }}" method="POST">
                    <button type="submit" style="border: none; background: none; cursor: pointer; font-size: 18px;">
                        {% if todo.is_done == 1 %} &#10003; {% else %} &#9675; {% endif %}
                    </button>
                </form>

                <!-- EDIT FORM (Shows input if not done, or just text if done) -->
                <form action="/edit/{{ todo.todo_id }}" method="POST" style="flex-grow: 1; margin: 0 10px;">
                    {% if todo.is_done == 1 %}
                        <span class="done-text">{{ todo.title }}</span>
                    {% else %}
                        <input type="text" name="title" value="{{ todo.title }}" style="border: none; width: 100%;">
                    {% endif %}
                </form>

                <!-- DELETE FORM (With "Are you sure?" JavaScript) -->
                <form action="/delete/{{ todo.todo_id }}" method="POST">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this task?');">Delete</button>
                </form>
            </div>
        {% endfor %}
    {% else %}
        <p>You have no tasks yet! Add one above.</p>
    {% endif %}

</body>
</html>
